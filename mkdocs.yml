site_name: discopt-calphad
site_description: Certified CALPHAD phase equilibrium as a discopt plugin
site_author: John Kitchin
site_url: https://kitchingroup.cheme.cmu.edu/discopt-calphad/
repo_url: https://github.com/jkitchin/discopt-calphad
repo_name: jkitchin/discopt-calphad
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Examples: examples.md
  - Databases: databases.md
  - Browser app: web-app.md
  - Design:
      - Architecture: architecture.md
      - Symbolic layer, diagrams, fitting: symbolic-diagrams-fitting.md
      - discopt feature requests: discopt-feature-requests.md
  - API reference: api.md

# logo and example figures are copied into docs/assets/ at build time (see the hook)
hooks:
  - docs_hooks.py

exclude_docs: |
  logo-prompt.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            members_order: source
            docstring_style: numpy
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
