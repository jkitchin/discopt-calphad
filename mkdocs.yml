site_name: discopt-calphad
site_description: Certified CALPHAD phase equilibrium as a discopt plugin
site_author: John Kitchin
site_url: https://kitchingroup.cheme.cmu.edu/discopt-calphad/
repo_url: https://github.com/jkitchin/discopt-calphad
repo_name: jkitchin/discopt-calphad
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Notebooks:
      - Overview: notebooks.md
      - Certified equilibrium: notebooks/01_certified_equilibrium.ipynb
      - Magnetic ordering: notebooks/02_magnetic.ipynb
      - Order–disorder: notebooks/03_order_disorder.ipynb
      - Ionic models: notebooks/04_ionic.ipynb
      - Einstein and two-state terms: notebooks/05_third_generation.ipynb
      - Fitting to data: notebooks/06_fitting.ipynb
  - Examples: examples.md
  - Databases: databases.md
  - Data from ASE calculators: mlip.md
  - Browser app: web-app.md
  - Design:
      - Architecture: architecture.md
      - Symbolic layer, diagrams, fitting: symbolic-diagrams-fitting.md
      - discopt feature requests: discopt-feature-requests.md
  - API reference: api.md

# the logo, example figures and notebooks are copied into docs/ at build time (see the hook)
hooks:
  - docs_hooks.py

exclude_docs: |
  logo-prompt.md

plugins:
  - search
  - mkdocs-jupyter:
      # only notebooks: pages are checked against `ignore` first, and otherwise read through jupytext/pandoc
      include: ["*.ipynb"]
      ignore: ["*.md", "*.py"]
      execute: false  # the notebooks are stored with their outputs (notebooks/build.py runs them)
      include_source: true
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            members_order: source
            docstring_style: numpy
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
