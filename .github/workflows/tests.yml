name: tests

# Fast test suite (slow solves are deselected) and lint on every push and pull
# request. The slow tests (pycalphad-oracle equilibria, full certified solves)
# run weekly and on demand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      slow:
        description: "Also run the slow tests"
        type: boolean
        default: false
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC: slow tests

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: uv sync --frozen

      - name: Run fast tests
        run: uv run --no-sync pytest -q -m "not slow"

  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: uv sync --frozen --only-group dev --no-install-project

      - name: ruff check
        run: uv run --no-sync ruff check .

      - name: ruff format
        run: uv run --no-sync ruff format --check .

  slow:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.slow)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: uv sync --frozen

      - name: Run slow tests
        run: uv run --no-sync pytest -q -m slow --durations=10
