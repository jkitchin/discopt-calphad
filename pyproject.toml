[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "discopt-calphad"
version = "0.0.1"
description = "Certified CALPHAD phase equilibrium plugin for the discopt modeling language"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John Kitchin", email = "jkitchin@andrew.cmu.edu" }]
dependencies = [
    "discopt>=0.8",
    "numpy>=1.24",
    "scipy>=1.10",
    "sympy>=1.12",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]

[dependency-groups]
dev = [
    "pytest>=8",
    "matplotlib>=3.7",
    "pycalphad>=0.11.1",
]

[tool.pytest.ini_options]
markers = ["slow: long-running solves (deselect with '-m \"not slow\"')"]

# discopt.calphad is a PEP 420 namespace subpackage merged into ``discopt`` at
# import time; only ``discopt.calphad`` is packaged so the base package is never
# shadowed.
[tool.setuptools.packages.find]
where = ["src"]
include = ["discopt.calphad*"]
namespaces = true
